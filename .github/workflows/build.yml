name: Android Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Create missing debug.keystore
      run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
        
    - name: Create dummy google-services.json
      run: |
        mkdir -p app
        echo '{"project_info":{"project_number":"1","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:1:android:1","android_client_info":{"package_name":"com.aistudio.hsstore.modapk"}},"oauth_client":[{"client_id":"dummy-web-client-id.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"dummy"}]}]}' > app/google-services.json
        
    - name: Build APK
      run: gradle assembleDebug
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HsStore-APK
        path: app/build/outputs/apk/debug/app-debug.apk
