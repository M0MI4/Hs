name: Android Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create debug and release keystores
        run: |
          rm -f ./debug.keystore ./my-upload-key.jks
          keytool -genkey -v -keystore ./debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -genkey -v -keystore ./my-upload-key.jks \
            -storepass android -alias upload -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=HsStore Release,O=HsStore,C=US"

      - name: Create google-services.json from Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build Release & Debug APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: gradle assembleRelease assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HsStore-APK
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
