name: Android Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create debug.keystore in all expected paths
        run: |
          mkdir -p ~/.android app
          rm -f ~/.android/debug.keystore ./debug.keystore app/debug.keystore
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cp ~/.android/debug.keystore ./debug.keystore
          cp ~/.android/debug.keystore app/debug.keystore

      - name: Create dummy google-services.json if missing
        run: |
          mkdir -p app
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"1","project_id":"ai-studio-android-hsstore-5afff47c-ff18-4e6a-894b-5eb263ea8a4b","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1:android:1","android_client_info":{"package_name":"com.aistudio.hsstore.modapk"}},"oauth_client":[{"client_id":"1-dummy.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"AIzaSyDummyKeyForBuildCompilationOnly"}],"services":{"appinvite_service":{"other_platform_oauth_client":[{"client_id":"1-dummy.apps.googleusercontent.com","client_type":3}]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Build Optimized Release & Debug APKs
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HsStore-APK
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
